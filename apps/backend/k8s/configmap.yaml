apiVersion: v1
kind: ConfigMap
metadata:
  name: opspilot-api-config
  labels:
    app.kubernetes.io/name: opspilot-api
    app.kubernetes.io/component: api
data:
  APP_NAME: OpsPilot Backend
  APP_ENV: production
  APP_VERSION: "1.0.0"
  GIN_MODE: release
  PORT: "8080"
  JWT_EXPIRY: 24h
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_WINDOW: 1m
