# This is a template only. Do not commit real values or apply it unchanged.
apiVersion: v1
kind: Secret
metadata:
  name: opspilot-api-secrets
  labels:
    app.kubernetes.io/name: opspilot-api
    app.kubernetes.io/component: api
type: Opaque
stringData:
  # Use a TLS-enabled PostgreSQL URL in production. URL-encode special characters.
  DATABASE_URL: postgres://USERNAME:PASSWORD@DATABASE_HOST:5432/DATABASE_NAME?sslmode=require
  JWT_SECRET: replace-with-a-long-random-secret
